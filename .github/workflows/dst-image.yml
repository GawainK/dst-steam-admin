name: DST runtime image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dst-runtime-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set runtime image and source tag
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/dst-server"
          tag="sha-${GITHUB_SHA:0:12}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify project before publishing
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint
      - name: Build and publish lightweight amd64 runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dst/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=dst-runtime
          cache-to: type=gha,mode=min,scope=dst-runtime
