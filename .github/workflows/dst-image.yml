name: DST game image

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'docker/dst/**'
      - 'scripts/dst/**'
      - 'apps/api/tests/dst-*.test.ts'
      - '.github/workflows/dst-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: dst-game-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Resolve current public game build
        id: version
        run: node scripts/dst/image-version.mjs
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable build and source tag
        id: image
        env:
          BUILD_ID: ${{ steps.version.outputs.build_id }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/dst-server"
          tag="build-${BUILD_ID}-${GITHUB_SHA:0:12}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && docker buildx imagetools inspect "$image:$tag" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify project before publishing
        if: steps.image.outputs.needed == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint
      - name: Build and publish preinstalled amd64 image
        if: steps.image.outputs.needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dst/Dockerfile
          target: preinstalled
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:build-${{ steps.version.outputs.build_id }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: |
            DST_BUILD_ID=${{ steps.version.outputs.build_id }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=dst-game
          cache-to: type=gha,mode=max,scope=dst-game
